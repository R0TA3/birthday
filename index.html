<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ജന്മദിനാശംസകൾ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Malayalam:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="prog" aria-live="polite">CHAPTER 01 / 10</div>
<main id="track"></main>
<nav id="bar" aria-label="Controls">
  <button id="prev" aria-label="Previous chapter">‹</button>
  <button id="pp" aria-label="Pause writing">❚❚</button>
  <button id="rep" aria-label="Replay writing">↻</button>
  <button id="skip" aria-label="Skip animation">Skip</button>
  <button id="mus" aria-label="Music on/off" aria-pressed="false">♪</button>
  <button id="next" aria-label="Next chapter">›</button>
</nav>
<audio id="aud" src="assets/music/music.mp3" loop preload="none"></audio>
<script src="script.js"></script>
</body>
</html>
